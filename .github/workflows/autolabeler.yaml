name: 'Auto Label 🏷️'

# yamllint disable-line rule:truthy
on:
  # pull_request is required for autolabeler
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  # pull_request_target is required for autolabeler on PRs from forks.
  #
  # This use of pull_request_target is safe and does NOT need
  # manual-approval gating because:
  #
  #   1. Nothing checks out PR code, so no PR-provided source
  #      ever runs.
  #   2. The workflow body is loaded from the base branch
  #      (pull_request_target semantics), not from the PR head.
  #   3. The job calls the generic-workflows autolabeler lane,
  #      pinned to a commit SHA, which runs only trusted, pinned
  #      code: it blocks runner egress to an allow-list, then
  #      applies labels through GitHub API calls that read PR
  #      metadata (e.g. title and labels).
  #   4. Permissions are scoped to the minimum needed:
  #      pull-requests: write and contents: read. No secrets
  #      reach the lane beyond the default GITHUB_TOKEN.
  #
  # The zizmor `dangerous-triggers` audit is silenced here
  # because the conditions it warns about (PR head code running
  # with elevated privileges) cannot occur in this workflow.
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ format('al-{0}-pr-{1}', github.event_name, github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  autolabel:
    name: 'Label PR'
    # The lane runs each pull request on one trigger, so none is
    # labelled twice: pull_request_target when the head repository
    # differs from the base (a fork), pull_request otherwise.
    permissions:
      pull-requests: write  # apply labels to the pull request
      contents: read  # read the autolabeler config from the repo
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/generic-workflows/.github/workflows/autolabeler.yaml@04672a980550ff9bd89d24bacd39fb03e25b0b0b # v0.6.1
