---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2024 The Linux Foundation

name: Compose Maven Merge

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      ARTIFACT_DIR:
        description: >
          Location of built artifacts. Relative paths resolve against the
          workspace.
        required: false
        default: "m2repo"
        type: string
      JDK_VERSION:
        description: "OpenJDK version"
        required: false
        default: "17"
        type: string
      MVN_VERSION:
        description: "Maven version"
        required: false
        default: "3.8.2"
        type: string
      MVN_PARAMS:
        description: "Maven parameters to pass to the mvn command"
        required: false
        default: ""
        type: string
      MVN_PHASES:
        description: "List of phases to execute"
        required: false
        default: "clean deploy"
        type: string
      MVN_OPTS:
        description: "Maven options"
        required: false
        # yamllint disable rule:line-length
        default: >-
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
          -DaltDeploymentRepository=staging::default::file:"${GITHUB_WORKSPACE}"/m2repo
        # yamllint enable rule:line-length
        type: string
      MVN_POM_FILE:
        description: "Path to pom.xml file."
        required: false
        default: "pom.xml"
        type: string
      MVN_PROFILES:
        description: "Comma-delimited list of profiles to activate"
        required: false
        default: ""
        type: string
      SIGUL_SIGN:
        description: "Boolean indicating whether to sign artifacts"
        required: false
        default: false
        type: boolean
      PUSH_NEXUS:
        description: "Boolean indicating whether to push to a Nexus server"
        required: false
        default: false
        type: boolean
      PUSH_ARTIFACTORY:
        description: "Boolean indicating whether to push to Artifactory"
        required: false
        default: false
        type: boolean
      PUSH_CENTRAL:
        description: "Boolean indicating whether to push to Maven Central"
        required: false
        default: false
        type: boolean
      JFROG_OPTIONS:
        description: >
          Options to be passed to the jfrog command during Artifactory push
        required: false
        default: ""
        type: string
      ENV_VARS:
        description: >
          JSON key/value pairs exposed to the Maven build as environment
          variables, e.g. toJSON(vars)
        required: false
        default: "{}"
        type: string
      ARCHIVE_ARTIFACTS:
        description: >
          Paths or glob patterns, relative to the workspace, to publish to
          the log server after every build, including failed ones. Separate
          entries with spaces or newlines. The archives directory is always
          included. Empty skips publishing. The calling job must grant
          id-token: write.
        required: false
        default: ""
        type: string
      LOG_SUBDIR:
        description: >
          Optional directory name appended to the per-run log path. Set it
          when a workflow calls this one more than once per run, so the
          calls do not overwrite each other.
        required: false
        default: ""
        type: string
    outputs:
      LOG_URL:
        description: "URL of the published logs, empty when not published"
        value: ${{ jobs.maven-merge.outputs.log_url }}
    # "secrets: inherit" only crosses repositories inside the same
    # organisation/enterprise. Callers in another organisation must pass
    # these explicitly, which is only possible if they are declared here.
    # All are optional so a caller need only supply the ones its enabled
    # PUSH_*/SIGUL_SIGN paths actually consume.
    secrets:
      NEXUS_USERNAME:
        description: "Nexus user, required when PUSH_NEXUS is true"
        required: false
      NEXUS_PASSWORD:
        description: "Nexus password, required when PUSH_NEXUS is true"
        required: false
      CENTRAL_USERNAME:
        description: "Maven Central user, required when PUSH_CENTRAL is true"
        required: false
      CENTRAL_PASSWORD:
        description: >
          Maven Central password, required when PUSH_CENTRAL is true
        required: false
      ARTIFACTORY_ACCESS_TOKEN:
        description: >
          JFrog access token, required when PUSH_ARTIFACTORY is true
        required: false
      SIGUL_KEY:
        description: "Sigul signing key name, used when SIGUL_SIGN is true"
        required: false
      SIGUL_IP:
        description: "Sigul bridge address, used when SIGUL_SIGN is true"
        required: false
      SIGUL_URI:
        description: "Sigul bridge URI, used when SIGUL_SIGN is true"
        required: false
      SIGUL_CONF:
        description: "Sigul client config, used when SIGUL_SIGN is true"
        required: false
      SIGUL_PASS:
        description: "Sigul key passphrase, used when SIGUL_SIGN is true"
        required: false
      SIGUL_PKI:
        description: "Sigul PKI material, used when SIGUL_SIGN is true"
        required: false
      GHA_TOKEN:
        description: >
          No longer used: the Sigul action needs a token only to push a
          signed git tag. Kept so callers still passing it do not fail.
        required: false

concurrency:
  # Keyed on the workflow_call inputs. In a reusable workflow
  # github.event.inputs is the *caller's* triggering event, not the
  # values passed in with:, so it is empty on schedule and push. That
  # made the whole key collapse to github.run_id, which is identical
  # for every job in a run, so a caller invoking this workflow more
  # than once per run put every call in one group.
  group: compose-maven-merge-${{ github.workflow }}-${{ inputs.GERRIT_BRANCH }}
  # Never cancel an in-flight deploy: a partially published artifact
  # set leaves maven-metadata.xml inconsistent.
  cancel-in-progress: false

jobs:
  maven-merge:
    name: maven-merge
    runs-on: ubuntu-latest
    outputs:
      group_path: ${{ steps.metadata.outputs.group_path }}
      log_url: ${{ steps.publish-logs.outputs.log_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.GERRIT_BRANCH }}
          submodules: "true"
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.11"
      - name: Pre-fetch SNAPSHOT metadata
        id: metadata
        if: ${{ inputs.PUSH_NEXUS }}
        env:
          NEXUS_URL: ${{ vars.NEXUS_SERVER }}
          NEXUS_REPO: ${{ vars.NEXUS_REPO }}
          ARTIFACT_DIR: ${{ inputs.ARTIFACT_DIR }}
          MVN_POM_FILE: ${{ inputs.MVN_POM_FILE }}
        run: |
          set -eu -o pipefail
          # maven-deploy-plugin derives the next SNAPSHOT buildNumber from
          # the maven-metadata.xml already published to Nexus. A clean
          # runner has none, so each build restarts the counter at 1 and
          # the publish clobbers the real SNAPSHOT history. Seed the local
          # repository with the published metadata first.
          #
          # Read the project's own groupId, falling back to the parent's
          # (Maven's inheritance rule). A plain grep for the first
          # <groupId> returns the *parent* groupId instead.
          group_id=$(python3 -c '
          import os
          import xml.etree.ElementTree as ET
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(os.environ["MVN_POM_FILE"]).getroot()
          group = root.findtext("m:groupId", namespaces=ns) or \
              root.findtext("m:parent/m:groupId", namespaces=ns)
          print(group.strip().replace(".", "/"))
          ')
          echo "group_path=${group_id}" >> "$GITHUB_OUTPUT"

          nexus_url="${NEXUS_URL}/content/repositories/${NEXUS_REPO}/${group_id}/"
          m2repo="${ARTIFACT_DIR}/${group_id}"

          echo "Fetching maven-metadata.xml from: ${nexus_url}"
          mkdir -p "${m2repo}"

          # Compute cut-dirs for wget:
          # URL path (no host): content/repositories/<repo>/<group segments...>
          # For org/opendaylight/infrautils: 3 + 3 = 6
          segments=$(echo "${group_id}" | tr '/' '\n' | wc -l)
          cut_dirs=$((3 + segments))

          # Fetch existing metadata into the m2repo group directory.
          # Ignore failures (404 = new project with no prior publishes).
          pushd "${m2repo}"
          wget -nv --recursive \
               --accept maven-metadata.xml \
               -R "index.html*" \
               --execute robots=off \
               --no-parent \
               --no-host-directories \
               --cut-dirs="${cut_dirs}" \
               "${nexus_url}" 2>&1 || true
          popd

          # Keep a pristine copy so the publish step can tell which
          # metadata this build actually changed.
          rm -rf "${ARTIFACT_DIR}-backup"
          mkdir -p "${ARTIFACT_DIR}-backup"
          cp -a "${ARTIFACT_DIR}/." "${ARTIFACT_DIR}-backup/"

          metadata_count=$(find "${m2repo}" -name "maven-metadata.xml" | wc -l)
          echo "Pre-fetched ${metadata_count} maven-metadata.xml files"
          if [ "${metadata_count}" -eq 0 ]; then
            # Expected only for a project with no prior publishes.
            # Otherwise the build restarts at buildNumber 1 and the
            # published metadata clobbers the real SNAPSHOT history.
            echo "::warning::No existing metadata found under" \
              "${nexus_url} — SNAPSHOT buildNumber will restart at 1"
          fi
      - name: Run Maven
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-build-action@22149998fae8dd5ef1ffc8890ec0ce3785683983 # v0.5.5
        with:
          java-version: ${{ inputs.JDK_VERSION }}
          mvn-version: ${{ inputs.MVN_VERSION }}
          mvn-params: ${{ inputs.MVN_PARAMS }}
          mvn-phases: ${{ inputs.MVN_PHASES }}
          mvn-opts: ${{ inputs.MVN_OPTS }}
          mvn-pom-file: ${{ inputs.MVN_POM_FILE }}
          mvn-profiles: ${{ inputs.MVN_PROFILES }}
          global-settings: ${{ vars.GLOBAL_SETTINGS }}
          env-vars: ${{ inputs.ENV_VARS }}
      - name: Sign artifacts
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/sigul-sign-action@997f9d803faea69dc912421d799a5cd439c5c6cc # v0.1.1
        # Typed workflow_call booleans arrive as real booleans, so
        # compare truthiness directly. Casting a boolean against the
        # string yields NaN, so the old comparison never matched.
        if: ${{ inputs.SIGUL_SIGN }}
        with:
          # The legacy (CentOS 7, sigul 0.207) client, chosen deliberately
          # until the signing keys move to the modern Sigul stack.
          container: legacy
          allow-legacy: "true"
          sign-type: "sign-data"
          # A directory signs every file beneath it except the default
          # exclude-globs (*.md5, *.sha1, maven-metadata.xml and the like),
          # writing <file>.asc beside each.
          sign-object: ${{ inputs.ARTIFACT_DIR }}
          sigul-key-name: ${{ secrets.SIGUL_KEY }}
          sigul-ip: ${{ secrets.SIGUL_IP }}
          sigul-uri: ${{ secrets.SIGUL_URI }}
          sigul-conf: ${{ secrets.SIGUL_CONF }}
          sigul-pass: ${{ secrets.SIGUL_PASS }}
          sigul-pki: ${{ secrets.SIGUL_PKI }}
      - name: Drop unmodified metadata
        if: ${{ inputs.PUSH_NEXUS }}
        env:
          ARTIFACT_DIR: ${{ inputs.ARTIFACT_DIR }}
        run: |
          set -eu -o pipefail
          # The pre-fetch seeded the local repository with every
          # maven-metadata.xml already published for this group, most of
          # which this build never touches. Re-uploading those would revert
          # any sibling artifact published while this build was running, so
          # drop the byte-identical ones and their checksums first.
          backup="${ARTIFACT_DIR}-backup"
          if [ ! -d "${backup}" ]; then
            echo "No metadata backup; nothing to prune"
            exit 0
          fi
          removed=0
          while IFS= read -r f; do
            [ -n "${f}" ] || continue
            rm -f "${f}" "${f}".*
            removed=$((removed + 1))
          done < <(diff -sr "${ARTIFACT_DIR}" "${backup}" 2>/dev/null \
            | sed -n 's/^Files \(.*\) and .* are identical$/\1/p')
          echo "Dropped ${removed} unmodified metadata files"
          find "${ARTIFACT_DIR}" -mindepth 1 -type d -empty -delete || true
      - name: Push build
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifact
          path: ${{ inputs.ARTIFACT_DIR }}
      # Equivalent of the Jenkins lf-infra-ship-logs builder. Runs after
      # failed and cancelled builds too. Without OIDC (no AWS_LOG_ROLE_ARN,
      # no id-token: write, or a fork) the logs go to a workflow artifact
      # instead. A publishing failure never changes the build result.
      - name: Resolve log path
        id: log-path
        if: ${{ always() && inputs.ARCHIVE_ARTIFACTS != '' }}
        shell: bash
        env:
          ARCHIVE_ARTIFACTS: ${{ inputs.ARCHIVE_ARTIFACTS }}
          LOG_SUBDIR: ${{ inputs.LOG_SUBDIR }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${LOG_SUBDIR}" \
            && ! "${LOG_SUBDIR}" =~ ^[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]]; then
            echo "::error::LOG_SUBDIR must be one path segment: ${LOG_SUBDIR}"
            exit 1
          fi
          # Calling workflow's file name, e.g. gerrit-merge
          workflow="${WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          workflow="${workflow%.*}"
          path="logs/gha/${GITHUB_REPOSITORY##*/}/${workflow}/${GITHUB_RUN_ID}"
          artifact="build-logs"
          if [ -n "${LOG_SUBDIR}" ]; then
            path="${path}/${LOG_SUBDIR}"
            artifact="${artifact}-${LOG_SUBDIR}"
          fi
          {
            echo "s3_path=${path}"
            echo "artifact_name=${artifact}"
            echo "patterns<<__ARCHIVE_PATTERNS__"
            printf '%s\n' "${ARCHIVE_ARTIFACTS}" | tr -s '[:space:]' '\n'
            echo "__ARCHIVE_PATTERNS__"
          } >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials for log publishing
        id: log-aws
        # yamllint disable-line rule:line-length
        if: ${{ always() && steps.log-path.outcome == 'success' && vars.AWS_LOG_ROLE_ARN != '' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_LOG_ROLE_ARN }}
          aws-region: ${{ vars.S3_LOG_REGION || 'us-east-1' }}
      - name: Publish logs
        id: publish-logs
        if: ${{ always() && steps.log-path.outcome == 'success' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/log-publish-action@f9dcb75646938a12517ec8a85dac0acba9f96eca # v0.2.1
        with:
          # yamllint disable-line rule:line-length
          destination: ${{ steps.log-aws.outcome == 'success' && (vars.LOG_PUBLISH_DESTINATION || 's3') || 'artifact' }}
          s3_bucket: ${{ vars.S3_LOG_BUCKET }}
          s3_path: ${{ steps.log-path.outputs.s3_path }}
          base_url: ${{ vars.LOG_BASE_URL }}
          aws_region: ${{ vars.S3_LOG_REGION || 'us-east-1' }}
          archive_patterns: ${{ steps.log-path.outputs.patterns }}
          artifact_name: ${{ steps.log-path.outputs.artifact_name }}

  publish-nexus:
    name: publish-nexus
    needs: maven-merge
    if: ${{ inputs.PUSH_NEXUS }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull build
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: "${{ inputs.ARTIFACT_DIR }}"
      - name: Publish to Nexus
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/nexus-publish-action@d929e9053da8383d47c1ae857e8aa4e47f6b1bd9 # v1.3.2
        with:
          nexus_server: ${{ vars.NEXUS_SERVER }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}
          repository_name: ${{ vars.NEXUS_REPO }}
          repository_format: "maven2_upload"
          # Scope to the group directory so the uploaded tree carries
          # Maven coordinates rather than a workspace-relative prefix.
          # yamllint disable-line rule:line-length
          files_path: ${{ inputs.ARTIFACT_DIR }}/${{ needs.maven-merge.outputs.group_path }}
          upload_path: ${{ needs.maven-merge.outputs.group_path }}

  publish-artifactory:
    name: publish-artifactory
    needs: maven-merge
    if: ${{ inputs.PUSH_ARTIFACTORY }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull build
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: "${{ inputs.ARTIFACT_DIR }}"
      - name: Install jfrog cli
        # yamllint disable-line rule:line-length
        uses: jfrog/setup-jfrog-cli@1a84ddcff2d475751d8392ef6d7ecb478a7cfe53 # v5.3.1
        env:
          JF_URL: ${{ vars.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
      - name: Publish to Artifactory
        env:
          ARTIFACT_DIR: ${{ inputs.ARTIFACT_DIR }}
          ARTIFACTORY_PATH: ${{ vars.ARTIFACTORY_PATH }}
          JFROG_OPTIONS: ${{ inputs.JFROG_OPTIONS }}
        run: |
          # Unquoted on purpose: JFROG_OPTIONS holds several words, and
          # an empty value must drop out rather than pass an empty argument.
          # shellcheck disable=SC2086
          jf rt upload ${ARTIFACT_DIR} \
          ${ARTIFACTORY_PATH} \
          ${JFROG_OPTIONS}

  publish-central:
    name: publish-central
    needs: maven-merge
    if: ${{ inputs.PUSH_CENTRAL }}
    runs-on: ubuntu-latest
    steps:
      - name: Pull build
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifact
          path: "${{ inputs.ARTIFACT_DIR }}"
      - name: Publish to Maven Central
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/nexus-publish-action@d929e9053da8383d47c1ae857e8aa4e47f6b1bd9 # v1.3.2
        with:
          nexus_server: ${{ vars.CENTRAL_SERVER }}
          nexus_username: ${{ secrets.CENTRAL_USERNAME }}
          nexus_password: ${{ secrets.CENTRAL_PASSWORD }}
          repository_name: ${{ vars.NEXUS_REPO }}
          files_path: ${{ inputs.ARTIFACT_DIR }}
