# Verifies action/workflow calls are pinned to SHA commit values
name: 📌 Audit GitHub Actions

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths: [".github/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/action-pin-audit.yaml@378fcc19ebdf37f17fde4888d4b71c83b21d6cf3 # v0.9.7
    permissions:
      contents: read
