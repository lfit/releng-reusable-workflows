# Verifies action/workflow calls are pinned to SHA commit values
name: 📌 Audit GitHub Actions

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
    paths: [".github/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/action-pin-audit.yaml@6edd9018efda10b7a429d0bb4658b5aa4bb2cd3f # v0.10.1
    permissions:
      contents: read
