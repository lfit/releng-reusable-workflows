name: Verify Maven Workflows

# yamllint disable-line rule:truthy
on:
  push:
    paths:

      - '.github/workflows/compose-maven-verify.yaml'
      - '.github/workflows/compose-maven-merge.yaml'
      - '.github/workflows/zzci-test-verify-maven.yaml'
      - '.github/workflows/composed-maven-sonar-cloud.yaml'
      - '.github/workflows/composed-maven-nexus-iq.yaml'
  pull_request:
    paths:

      - '.github/workflows/compose-maven-verify.yaml'
      - '.github/workflows/compose-maven-merge.yaml'
      - '.github/workflows/zzci-test-verify-maven.yaml'
      - '.github/workflows/composed-maven-sonar-cloud.yaml'
      - '.github/workflows/composed-maven-nexus-iq.yaml'

jobs:
  test-maven-verify:
    uses: ./.github/workflows/compose-maven-verify.yaml
    with:
      GERRIT_BRANCH: ${{ github.ref }}
      GERRIT_CHANGE_ID: Ic8aaa0728a43936cd4c6e1ed590e01ba8f0fbf5b
      MVN_POM_FILE: test/maven-project/pom.xml
      MVN_GLOBAL_SETTINGS: "<settings/>"

  # This repository has no AWS_LOG_ROLE_ARN, so the logs take the
  # workflow artifact fallback, which the next job checks. It runs after
  # test-maven-verify because both calls share one concurrency group.
  test-maven-verify-logs:
    needs: test-maven-verify
    uses: ./.github/workflows/compose-maven-verify.yaml
    with:
      GERRIT_BRANCH: ${{ github.ref }}
      GERRIT_CHANGE_ID: Ic8aaa0728a43936cd4c6e1ed590e01ba8f0fbf5b
      MVN_POM_FILE: test/maven-project/pom.xml
      MVN_GLOBAL_SETTINGS: "<settings/>"
      ARCHIVE_ARTIFACTS: "test/maven-project/pom.xml **/no-such-file.log"
      LOG_SUBDIR: ci

  check-maven-verify-logs:
    needs: test-maven-verify-logs
    runs-on: ubuntu-latest
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-logs-ci
          path: logs
      - name: Check published content
        shell: bash
        env:
          LOG_URL: ${{ needs.test-maven-verify-logs.outputs.LOG_URL }}
        run: |
          set -euo pipefail
          find logs -type f | sort
          test -f logs/test/maven-project/pom.xml
          test -f logs/_build-details.log
          test -z "${LOG_URL}"
