# GitHub Actions security audit using zizmor.
#
# This workflow delegates to the lfreleng-actions/security-workflows
# zizmor lane, which audits this repository's workflows in SARIF mode
# behind a block-mode harden-runner and writes a findings summary. The
# lane's defaults audit the whole repository with the auditor persona
# at every severity. The zizmor version follows the scan action the
# lane pins, so Dependabot bumping the lane ref below bumps zizmor.
#
# Mode: SARIF, advisory (zizmor exits 0, so this does not block merges).
# The lane's audit job holds only contents: read. With upload_sarif
# set, a separate lane job holding security-events: write publishes the
# SARIF to code scanning under the 'zizmor' category, on default-branch
# pushes only. Pull request runs, forks included, stay advisory.

name: 'Zizmor Scan 🌈'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch: {}
  pull_request: {}
  push: {}

# Default to no permissions; the job below grants what the lane needs.
permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  zizmor:
    name: 'Zizmor'
    # Skip pushes to non-default branches and tags. The lane's audit and
    # upload jobs skip them anyway, so calling it would only run its
    # input validation. Pull request and workflow_dispatch events run.
    if: >-
      github.event_name != 'push'
      || github.ref_name == github.event.repository.default_branch
    # A called job cannot hold more than its caller grants, so this job
    # carries the upload job's scopes; each lane job declares its own.
    permissions:
      contents: read
      security-events: write  # lane upload job publishes SARIF
      actions: read  # upload-sarif reads run info on private repos
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/zizmor.yaml@378fcc19ebdf37f17fde4888d4b71c83b21d6cf3 # v0.9.7
    with:
      upload_sarif: true
