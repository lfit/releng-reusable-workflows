---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2023 The Linux Foundation

name: Compose Maven Verify

# maven-verify inherits the caller's grant (see the job), so no permissions: {}
# yamllint disable-line rule:truthy
on:  # zizmor: ignore[excessive-permissions]
  workflow_call:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: false
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: false
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: false
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: false
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: false
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: false
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: false
        type: string
      JDK_VERSION:
        description: "OpenJDK version"
        required: false
        default: "17"
        type: string
      MVN_VERSION:
        description: "Maven version"
        required: false
        default: "3.8.2"
        type: string
      MVN_PARAMS:
        description: "Maven parameters to pass to the mvn command"
        required: false
        default: ""
        type: string
      MVN_PHASES:
        description: "Comma separated list of phases to execute"
        required: false
        default: "clean deploy"
        type: string
      MVN_OPTS:
        description: "Maven options"
        required: false
        # yamllint disable rule:line-length
        default: >-
          -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
          -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
          -DaltDeploymentRepository=staging::default::file:"${GITHUB_WORKSPACE}"/m2repo
        # yamllint enable rule:line-length
        type: string
      MVN_POM_FILE:
        description: "Path to pom.xml file."
        required: false
        default: "pom.xml"
        type: string
      MVN_PROFILES:
        description: "Comma-delimited list of profiles to activate"
        required: false
        default: ""
        type: string
      MVN_GLOBAL_SETTINGS:
        description: "Maven global settings configuration."
        required: false
        default: ${{ vars.GLOBAL_SETTINGS }}
        type: string
      ENV_VARS:
        # yamllint disable-line rule:line-length
        description: "Pass GitHub variables to be exported as environment variables via `toJSON(vars)` or specific variables encoded in JSON format"
        required: false
        default: "{}"
        type: string
      ENV_SECRETS:
        # yamllint disable-line rule:line-length
        description: "Pass GitHub secrets to be exported as environment variables via `toJSON(secrets)` or specific secrets encoded in JSON format"
        required: false
        default: "{}"
        type: string
      POST_BUILD_SCRIPT:
        description: "Post-build script to run after Maven build"
        required: false
        default: ""
        type: string
      POST_BUILD_SCRIPT_PATH:
        description: "Path to post-build script to run after Maven build"
        required: false
        default: ""
        type: string
      POST_BUILD_SCRIPT_URL:
        description: "URL of post-build script to run after Maven build"
        required: false
        default: ""
        type: string
      PRE_BUILD_SCRIPT:
        description: "Pre-build script to run before Maven build"
        required: false
        default: ""
        type: string
      PRE_BUILD_SCRIPT_PATH:
        description: "Path to pre-build script to run before Maven build"
        required: false
        default: ""
        type: string
      PRE_BUILD_SCRIPT_URL:
        description: "URL of pre-build script to run before Maven build"
        required: false
        default: ""
        type: string
      ARCHIVE_ARTIFACTS:
        description: >
          Paths or glob patterns, relative to the workspace, to publish to
          the log server after every build, including failed ones. Separate
          entries with spaces or newlines. The archives directory is always
          included. Empty skips publishing. The calling job must grant
          id-token: write.
        required: false
        default: ""
        type: string
      LOG_SUBDIR:
        description: >
          Optional directory name appended to the per-run log path. Set it
          when a workflow calls this one more than once per run, so the
          calls do not overwrite each other.
        required: false
        default: ""
        type: string
    outputs:
      LOG_URL:
        description: "URL of the published logs, empty when not published"
        value: ${{ jobs.maven-verify.outputs.log_url }}

concurrency:
  # yamllint disable-line rule:line-length
  group: compose-maven-verify-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH}}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

jobs:
  # The caller decides: requesting id-token: write (S3 logs) fails callers
  # granting only contents: read; narrowing it drops S3 logs where granted.
  maven-verify:  # zizmor: ignore[excessive-permissions]
    name: maven-verify
    runs-on: ubuntu-latest
    outputs:
      log_url: ${{ steps.publish-logs.outputs.log_url }}
    env:
      PRE_BUILD: ""
      POST_BUILD: ""
    steps:
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/checkout-gerrit-change-action@f0dd3d4dd4fceff1f56348152ecf0e040594f16a  # v1.2.1
        with:
          gerrit-refspec: ${{ inputs.GERRIT_REFSPEC }}
          gerrit-project: ${{ inputs.GERRIT_PROJECT }}
          gerrit-url: ${{ vars.GERRIT_URL }}
          delay: "0s"
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.11"
      - name: Pre-build path
        if: ${{ inputs.PRE_BUILD_SCRIPT_PATH != '' }}
        env:
          PRE_BUILD_SCRIPT_PATH: ${{ inputs.PRE_BUILD_SCRIPT_PATH }}
        # yamllint disable rule:line-length
        run: |
          echo "PRE_BUILD=${PRE_BUILD_SCRIPT_PATH}" >> "$GITHUB_ENV"
        # yamllint enable rule:line-length
      - name: Pre-build script
        if: ${{ inputs.PRE_BUILD_SCRIPT != '' }}
        env:
          PRE_BUILD_SCRIPT: ${{ inputs.PRE_BUILD_SCRIPT }}
        run: |
          printf '%s\n' "${PRE_BUILD_SCRIPT}" > "${GITHUB_RUN_ID}-pre.sh"
          chmod +x "${GITHUB_RUN_ID}-pre.sh"
          echo "PRE_BUILD=${GITHUB_RUN_ID}-pre.sh" >> "$GITHUB_ENV"
      - name: Pre-build URL
        if: ${{ inputs.PRE_BUILD_SCRIPT_URL != '' }}
        env:
          PRE_BUILD_SCRIPT_URL: ${{ inputs.PRE_BUILD_SCRIPT_URL }}
        # yamllint disable rule:line-length
        run: |
          curl -fsSL "${PRE_BUILD_SCRIPT_URL}" > "${GITHUB_RUN_ID}-pre.sh"
          chmod +x "${GITHUB_RUN_ID}-pre.sh"
          echo "PRE_BUILD=${GITHUB_RUN_ID}-pre.sh" >> "$GITHUB_ENV"
        # yamllint enable rule:line-length
      - name: Run pre-build
        if: ${{ env.PRE_BUILD != '' }}
        shell: bash
        run: |
          echo "::group::Pre-build script output"
          bash -euo pipefail "$PRE_BUILD"
          echo "::endgroup::"
      - name: Run Maven
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/maven-build-action@22149998fae8dd5ef1ffc8890ec0ce3785683983 # v0.5.5
        with:
          java-version: ${{ inputs.JDK_VERSION }}
          mvn-version: ${{ inputs.MVN_VERSION }}
          mvn-params: ${{ inputs.MVN_PARAMS }}
          mvn-phases: ${{ inputs.MVN_PHASES }}
          mvn-opts: ${{ inputs.MVN_OPTS }}
          mvn-pom-file: ${{ inputs.MVN_POM_FILE }}
          mvn-profiles: ${{ inputs.MVN_PROFILES }}
          env-vars: ${{ inputs.ENV_VARS }}
          env-secrets: ${{ inputs.ENV_SECRETS }}
          global-settings: ${{ inputs.MVN_GLOBAL_SETTINGS }}
      - name: Post-build path
        if: ${{ inputs.POST_BUILD_SCRIPT_PATH != '' }}
        env:
          POST_BUILD_SCRIPT_PATH: ${{ inputs.POST_BUILD_SCRIPT_PATH }}
        # yamllint disable rule:line-length
        run: |
          echo "POST_BUILD=${POST_BUILD_SCRIPT_PATH}" >> "$GITHUB_ENV"
        # yamllint enable rule:line-length
      - name: Post-build script
        if: ${{ inputs.POST_BUILD_SCRIPT != '' }}
        env:
          POST_BUILD_SCRIPT: ${{ inputs.POST_BUILD_SCRIPT }}
        run: |
          printf '%s\n' "${POST_BUILD_SCRIPT}" > "${GITHUB_RUN_ID}.sh"
          chmod +x "${GITHUB_RUN_ID}.sh"
          echo "POST_BUILD=${GITHUB_RUN_ID}.sh" >> "$GITHUB_ENV"
      - name: Post-build URL
        if: ${{ inputs.POST_BUILD_SCRIPT_URL != '' }}
        env:
          POST_BUILD_SCRIPT_URL: ${{ inputs.POST_BUILD_SCRIPT_URL }}
        # yamllint disable rule:line-length
        run: |
          curl -fsSL "${POST_BUILD_SCRIPT_URL}" > "${GITHUB_RUN_ID}.sh"
          chmod +x "${GITHUB_RUN_ID}.sh"
          echo "POST_BUILD=${GITHUB_RUN_ID}.sh" >> "$GITHUB_ENV"
        # yamllint enable rule:line-length
      - name: Run post-build
        if: ${{ env.POST_BUILD != '' }}
        shell: bash
        run: |
          echo "::group::Post-build script output"
          bash -euo pipefail "$POST_BUILD"
          echo "::endgroup::"
      # Equivalent of the Jenkins lf-infra-ship-logs builder. Runs after
      # failed and cancelled builds too. Without OIDC (no AWS_LOG_ROLE_ARN,
      # no id-token: write, or a fork) the logs go to a workflow artifact
      # instead. A publishing failure never changes the build result.
      - name: Resolve log path
        id: log-path
        if: ${{ always() && inputs.ARCHIVE_ARTIFACTS != '' }}
        shell: bash
        env:
          ARCHIVE_ARTIFACTS: ${{ inputs.ARCHIVE_ARTIFACTS }}
          LOG_SUBDIR: ${{ inputs.LOG_SUBDIR }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          if [[ -n "${LOG_SUBDIR}" \
            && ! "${LOG_SUBDIR}" =~ ^[A-Za-z0-9_-][A-Za-z0-9._-]*$ ]]; then
            echo "::error::LOG_SUBDIR must be one path segment: ${LOG_SUBDIR}"
            exit 1
          fi
          # Calling workflow's file name, e.g. gerrit-verify
          workflow="${WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"
          workflow="${workflow%.*}"
          path="logs/gha/${GITHUB_REPOSITORY##*/}/${workflow}/${GITHUB_RUN_ID}"
          artifact="build-logs"
          if [ -n "${LOG_SUBDIR}" ]; then
            path="${path}/${LOG_SUBDIR}"
            artifact="${artifact}-${LOG_SUBDIR}"
          fi
          {
            echo "s3_path=${path}"
            echo "artifact_name=${artifact}"
            echo "patterns<<__ARCHIVE_PATTERNS__"
            printf '%s\n' "${ARCHIVE_ARTIFACTS}" | tr -s '[:space:]' '\n'
            echo "__ARCHIVE_PATTERNS__"
          } >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials for log publishing
        id: log-aws
        # yamllint disable-line rule:line-length
        if: ${{ always() && steps.log-path.outcome == 'success' && vars.AWS_LOG_ROLE_ARN != '' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_LOG_ROLE_ARN }}
          aws-region: ${{ vars.S3_LOG_REGION || 'us-east-1' }}
      - name: Publish logs
        id: publish-logs
        if: ${{ always() && steps.log-path.outcome == 'success' }}
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/log-publish-action@f9dcb75646938a12517ec8a85dac0acba9f96eca # v0.2.1
        with:
          # yamllint disable-line rule:line-length
          destination: ${{ steps.log-aws.outcome == 'success' && (vars.LOG_PUBLISH_DESTINATION || 's3') || 'artifact' }}
          s3_bucket: ${{ vars.S3_LOG_BUCKET }}
          s3_path: ${{ steps.log-path.outputs.s3_path }}
          base_url: ${{ vars.LOG_BASE_URL }}
          aws_region: ${{ vars.S3_LOG_REGION || 'us-east-1' }}
          archive_patterns: ${{ steps.log-path.outputs.patterns }}
          artifact_name: ${{ steps.log-path.outputs.artifact_name }}
