name: Compose Gradle Publish

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string
      JDK_VERSION:
        description: "OpenJDK version"
        required: false
        default: "17"
        type: string
      NEXUS_URL:
        description: "Nexus repo URL where the artifacts will be published"
        required: true
        type: string
      DIRECTORY:
        description: "Location where the artifacts are built"
        required: true
        type: string
      FILE_EXTENSION:
        description: "Artifacts file extension"
        required: false
        default: jar
        type: string
    secrets:
      NEXUS_USERNAME:
        description: "Nexus username for the artifact upload"
        required: false
      NEXUS_PASSWORD:
        description: "Nexus password for the artifact upload"
        required: true

concurrency:
  # yamllint disable-line rule:line-length
  group: compose-gradle-publish-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH}}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  gradle-publish:
    name: gradle-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.GERRIT_BRANCH }}
          submodules: "true"
          persist-credentials: false
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.11"
      - name: Get global settings file
        shell: bash
        env:
          GLOBAL_SETTINGS: ${{ vars.GLOBAL_SETTINGS }}
        run: |
          printf '%s\n' "${GLOBAL_SETTINGS}" > global-settings.xml
          cat global-settings.xml
      - name: Build with Gradle
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/gradle-build-action@62e164ecb3db615191f718067a09efca6f2b3057 # v0.7.0
        with:
          java-version: ${{ inputs.JDK_VERSION }}
          distribution: "temurin"
          build-arguments: "shadowJar"
          # Open source (MIT) caching; the default 'enhanced' is proprietary
          cache-provider: "basic"
          # shadowJar runs no tests, so there are no reports to upload
          artifact-upload: "false"
      - name: Run Gradle publish
        # yamllint disable rule:line-length
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ inputs.NEXUS_URL }}
          DIRECTORY: ${{ inputs.DIRECTORY }}
          FILE_EXTENSION: ${{ inputs.FILE_EXTENSION }}
        # yamllint disable-line rule:line-length
        run: |
          curl https://raw.githubusercontent.com/lfit/releng-nexus-upload/main/nexus-upload.sh | bash
