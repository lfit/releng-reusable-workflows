---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2023 The Linux Foundation

name: Compose rtdv3 Merge

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        type: string
      GERRIT_CHANGE_ID:
        description: "The ID for the change"
        required: true
        type: string
      GERRIT_CHANGE_NUMBER:
        description: "The Gerrit number"
        required: true
        type: string
      GERRIT_CHANGE_URL:
        description: "URL to the change"
        required: true
        type: string
      GERRIT_EVENT_TYPE:
        description: "Type of Gerrit event"
        required: true
        type: string
      GERRIT_PATCHSET_NUMBER:
        description: "The patch number for the change"
        required: true
        type: string
      GERRIT_PATCHSET_REVISION:
        description: "The revision sha"
        required: true
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        type: string
      GERRIT_REFSPEC:
        description: "Gerrit refspec of change"
        required: true
        type: string
      TARGET_REPO:
        # yamllint disable-line rule:line-length
        description: "The target GitHub repository needing the required workflow"
        required: false
        default: ${{ github.repository }}
        type: string
    secrets:
      RTD_TOKEN:
        description: "RTD API user token"
        required: true

concurrency:
  # yamllint disable-line rule:line-length
  group: compose-rtdv3-merge-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH}}-${{ github.event.inputs.GERRIT_CHANGE_ID || github.run_id }}
  cancel-in-progress: true

env:
  READTHEDOCS_FOUND: true
  TOX_ENVS: docs,docs-linkcheck
  TOX_DIR: docs/
  DOC_DIR: _build/html
  PARALLEL: true
  DEFAULT_VERSION: latest
  MASTER_RTD_PROJECT: doc

jobs:
  rtd-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.GERRIT_BRANCH }}
          repository: ${{ inputs.TARGET_REPO }}
          submodules: "true"
      # yamllint disable-line rule:line-length
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          # This interpreter only runs lftools-uv to drive the Read the
          # Docs API; it never builds the project's documentation, so it
          # is unrelated to the Python version in the project's tox.ini
          # or .readthedocs.yaml. lftools-uv requires Python >=3.11, so
          # this cannot drop back to the 3.8 it was once pinned to.
          python-version: "3.13"
      - name: Install graphviz
        # yamllint disable-line rule:line-length
        uses: tlylt/install-graphviz@b2201200d85f06f0189cb74d9b69208504cf12cd # v1.0.0
      - name: Verify If readthedocs Config exists
        run: |
          echo "Verifying if readthedocs.yaml config file exists"
          if [ ! -f .readthedocs.yaml ] ; then
            echo "INFO Config file not found. Skipping further checks."
            echo "READTHEDOCS_FOUND=false" >> "$GITHUB_ENV"
          fi
      - name: Installing dependencies
        if: ${{ env.READTHEDOCS_FOUND == 'true' }}
        run: |
          python -m pip install --upgrade pip
          # Invoke pip via the interpreter rather than PATH so these
          # installs land in the interpreter configured above.
          # lftools-uv 0.9.0 is the first release to exit 3 when a read
          # finds no project or version, which the steps below rely on to
          # tell "not found" from an outage or a rejected token.
          python -m pip install 'lftools-uv>=0.9.0' 'niet~=1.4.2' tox
      - name: Running rtdv3
        # yamllint disable rule:line-length
        if: ${{ env.READTHEDOCS_FOUND == 'true' }}
        run: |
          echo "---> Running rtdv3"
          set -euo pipefail

          # Creating the lftools-uv config file. lftools-uv reads the same
          # ~/.config/lftools/lftools.ini path as lftools did, so the
          # Jenkins-managed config for this token needs no change.
          mkdir -p "${HOME}/.config/lftools"
          cat << EOF > "${HOME}/.config/lftools/lftools.ini"
          [rtd]
          endpoint=https://readthedocs.org/api/v3/
          token=${{ secrets.RTD_TOKEN }}
          EOF

          # Print the JSON 'lftools-uv rtd ARGS... --json' reports. Exit 3
          # means Read the Docs has no such project or version; return 2 for
          # that and 1 for anything else, so an outage or a rejected token
          # cannot pass for "not found".
          rtd_json(){
              local out rc=0
              out="$(lftools-uv rtd "$@" --json)" || rc=$?
              if (( rc == 0 )); then
                  printf '%s\n' "$out"
                  return 0
              fi
              if (( rc == 3 )); then
                  return 2
              fi
              echo "ERROR: lftools-uv rtd $* failed with exit status $rc" >&2
              return 1
          }

          # Return 0 when Read the Docs has project $1, and 1 when it reports
          # the project missing. Stop the job when it cannot tell.
          rtd_project_exists(){
              local rc=0
              rtd_json project-details "$1" > /dev/null || rc=$?
              case $rc in
                  0) return 0 ;;
                  2) return 1 ;;
                  *) exit 1 ;;
              esac
          }

          # Print the Read the Docs version slug of branch $1. Read the Docs
          # lowercases a branch name and replaces each run of characters
          # outside [a-z0-9._-] with a hyphen, so branch stable/scandium is
          # version stable-scandium. Requests pass the branch with
          # --from-branch so lftools-uv applies the rule; this copy only
          # names the version in messages.
          rtd_version_slug(){
              printf '%s\n' "$1" | tr '[:upper:]' '[:lower:]' \
                  | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//'
          }

          # Print "active" or "inactive" for the version of branch $2 in
          # project $1, or "missing" when Read the Docs has not seen it.
          rtd_version_state(){
              local version details active rc=0
              version="$(rtd_version_slug "$2")"
              details="$(rtd_json project-version-details "$1" "$2" \
                  --from-branch)" || rc=$?
              case $rc in
                  0) ;;
                  2) echo missing; return 0 ;;
                  *) exit 1 ;;
              esac
              active="$(jq -r '.active' <<< "$details")"
              case $active in
                  true) echo active ;;
                  false) echo inactive ;;
                  *)
                      echo "ERROR: version $version of project $1 has no" \
                          "active flag: $active" >&2
                      exit 1
                      ;;
              esac
          }

          # Build branch $1 and wait for the build, polling every 10 seconds
          # for up to an hour. Stop the job unless the build succeeds.
          watchbuild(){
              echo "INFO: Running build against branch $1"
              local trigger buildid details result
              local -i polls=360
              trigger="$(rtd_json project-build-trigger "$rtdproject" "$1" \
                  --from-branch)"
              buildid="$(jq -r '.build.id // empty' <<< "$trigger")"
              if [[ ! $buildid =~ ^[0-9]+$ ]]; then
                  echo "ERROR: Read the Docs returned no build id for $1:" \
                      "$trigger" >&2
                  exit 1
              fi

              # Read the Docs reports success as null until the build ends.
              while true; do
                  sleep 10
                  details="$(rtd_json project-build-details "$rtdproject" \
                      "$buildid")"
                  result="$(jq -r '.success' <<< "$details")"
                  echo "INFO Current result of running build $result"
                  case $result in
                      true) break ;;
                      false)
                          echo "ERROR: read the docs build $buildid" \
                              "failed" >&2
                          exit 1
                          ;;
                      null) ;;
                      *)
                          echo "ERROR: read the docs build $buildid has no" \
                              "success flag: $result" >&2
                          exit 1
                          ;;
                  esac
                  polls=$((polls - 1))
                  if (( polls <= 0 )); then
                      echo "ERROR: read the docs build $buildid did not" \
                          "finish within an hour" >&2
                      exit 1
                  fi
              done
              echo "INFO: read the docs build completed with status: $result"
          }

          project_original=${{ inputs.GERRIT_PROJECT }}
          project_dashed="${project_original////-}"
          umbrella=$(echo ${{ inputs.GERRIT_CHANGE_URL }} | awk -F'.' '{print $2}')
          rtdproject="$umbrella-$project_dashed"
          masterproject=${umbrella}-${{ env.MASTER_RTD_PROJECT }}
          #Exceptions needed for onap, due to importing their old docs.
          if [[ $masterproject == "onap-doc" ]]; then
              masterproject="onap"
          fi
          if [[ $rtdproject == "onap-doc" ]]; then
              rtdproject="onap"
          fi
          echo "INFO:"
          echo "INFO: Project: ${{ inputs.GERRIT_PROJECT }}"
          echo "INFO: Read the Docs Sub Project: https://$rtdproject.readthedocs.io"
          echo "INFO: Read the Docs Master Project: https://$masterproject.readthedocs.io"

          echo "INFO: Performing merge action"

          # rtd_project_exists reports whether Read the Docs has the project.
          project_exists=false
          project_created=false

          declare -i cnt=0
          while [[ $project_exists == "false" ]]; do
              if ! rtd_project_exists "$rtdproject"; then
                  echo "INFO: Project not found"
                  if [[ $project_created == "false" ]]; then
                      echo "INFO: Creating project https://$rtdproject.readthedocs.io"
                      lftools-uv rtd project-create "$rtdproject" "${{ inputs.GERRIT_CHANGE_URL }}" \
                          git "https://$rtdproject.readthedocs.io" py en
                      project_created="true"
                  fi
                  echo "INFO sleeping for 30 seconds $cnt times"
                  sleep 30
                  cnt=$((cnt+1))
                  if (( cnt >= 20 )); then
                      echo "INFO: Job has timed out"
                      exit 1
                  fi
              else
                  echo "INFO: Project exists in read the docs as https://$rtdproject.readthedocs.io"
                  project_exists="true"
              fi
          done

          if [[ "$rtdproject" != "$masterproject" ]]; then
              subprojects="$(rtd_json subproject-list "$masterproject")"
              if ! jq -e '.subprojects | type == "array"' <<< "$subprojects" > /dev/null; then
                  echo "ERROR: no subproject list for $masterproject: $subprojects" >&2
                  exit 1
              fi

              if jq -e --arg p "$rtdproject" 'any(.subprojects[]; . == $p)' \
                      <<< "$subprojects" > /dev/null; then
                  echo "INFO: subproject $rtdproject relationship already created"
              else
                  echo "INFO: Creating subproject relationship"
                  lftools-uv rtd subproject-create "$masterproject" "$rtdproject"
                  echo "INFO sleeping for 10 seconds"
                  sleep 10
              fi
          fi

          # api v3 method does not update /latest/ when master is triggered.
          # Also, when we build anything other than master we want to trigger /stable/ as well.
          # allow projects to change their landing page from latest to branch_name

          project_details="$(rtd_json project-details "$rtdproject")"
          current_version="$(jq -r .default_version <<< "$project_details")"
          if [[ -z ${{ env.DEFAULT_VERSION }} ]]; then
              echo "DEFAULT_VERSION (default-version) value cannot be empty"
              exit 1
          fi
          default_version="${{ env.DEFAULT_VERSION }}"

          echo "INFO: current default version $current_version"
          if [[ $current_version != "$default_version" ]]; then
              echo "INFO: Setting rtd landing page to $default_version"
              lftools-uv rtd project-update "$rtdproject" default_version="$default_version"
          fi

          if [[ ${{ inputs.GERRIT_BRANCH }} == "master" ]]; then
              echo "INFO: triggering $rtdproject latest"
              watchbuild latest
          else

              # Read the Docs addresses a branch by its version slug
              branch="${{ inputs.GERRIT_BRANCH }}"
              version="$(rtd_version_slug "$branch")"
              echo "INFO: Checking if read the docs has seen branch $branch as version $version"

              version_state="$(rtd_version_state "$rtdproject" "$branch")"
              if [[ $version_state == missing ]]; then
                  echo "INFO: read the docs has not seen version $version for project $rtdproject"
                  echo "INFO: triggering $rtdproject latest to instantiate new branch discovery"
                  watchbuild latest
              fi

              echo "INFO: triggering $rtdproject $version"
              watchbuild "$branch"

              #Make newly discovered branches visible in the u/i
              version_state="$(rtd_version_state "$rtdproject" "$branch")"
              if [[ $version_state == inactive ]]; then
                  echo "INFO: Marking $version as active for project $rtdproject"
                  lftools-uv rtd project-version-update "$rtdproject" "$branch" true --from-branch
              fi
          fi
          echo "INFO: Merge job completed"
