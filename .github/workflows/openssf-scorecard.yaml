name: 🔐 OpenSSF Scorecard
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  # For Branch-Protection check. Only the default branch is supported. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#branch-protection
  branch_protection_rule:
  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  schedule:
    - cron: "50 4 * * 0"
  push:
    branches: ["main", "master"]
    paths:
      - "**"

# Declare default permissions as none.
permissions: {}

jobs:
  openssf-scorecard:
    name: "OpenSSF Scorecard"
    # yamllint disable-line rule:line-length
    uses: lfreleng-actions/security-workflows/.github/workflows/openssf-scorecard.yaml@378fcc19ebdf37f17fde4888d4b71c83b21d6cf3 # v0.9.7
    # The lane's scan job requests all four scopes, and a called job
    # cannot hold more than its caller grants. Keep id-token: write off
    # every other job: the Scorecard API rejects the results otherwise.
    permissions:
      contents: read  # checkout
      security-events: write  # upload results to code scanning
      id-token: write  # publish results and obtain the badge, via OIDC
      actions: read  # upload-sarif reads run info on private repos
